<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercedes-Benz Ultra Tuning Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .neon-text { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px #3b82f6; }
        .glass { background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .tuning-card { transition: 0.3s; border: 1px solid transparent; }
        .tuning-card:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        input[type="range"] { accent-color: #3b82f6; }
    </style>
</head>
<body>

    <!-- Asosiy 3D maydon -->
    <div id="canvas-container" class="w-full h-screen"></div>

    <!-- HUD (Interface) -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between p-8">
        <!-- Tepasi: Logotip va Holat -->
        <div class="flex justify-between items-start interactive pointer-events-auto">
            <div class="glass p-5 rounded-2xl">
                <h1 class="neon-text text-2xl font-black">MERCEDES <span class="text-blue-500">AMG GTR</span></h1>
                <div class="flex gap-4 mt-2 text-[10px] text-gray-400 uppercase tracking-widest">
                    <span>Aero: <b id="aero-val" class="text-white">Active</b></span>
                    <span>Weight: <b id="weight-val" class="text-white">1550kg</b></span>
                </div>
            </div>
            <div class="glass p-5 rounded-2xl text-right">
                <p class="text-xs text-gray-400 uppercase">Dvigatel Quvvati</p>
                <h2 id="hp-text" class="text-4xl font-black italic">585 <span class="text-sm">HP</span></h2>
                <div class="w-48 h-1 bg-gray-800 mt-2 rounded-full overflow-hidden">
                    <div id="hp-bar" class="h-full bg-blue-500 transition-all duration-700" style="width: 60%"></div>
                </div>
            </div>
        </div>

        <!-- Pastki qism: Tuning Kategoriyalari -->
        <div class="flex justify-center gap-4 interactive pointer-events-auto pb-4">
            <!-- Stage 1-4 Motor -->
            <div class="glass p-4 rounded-2xl w-64">
                <p class="text-[10px] font-bold text-blue-500 mb-3 uppercase">Engine Performance</p>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setStage(1)" class="bg-gray-800 p-2 rounded text-xs hover:bg-blue-600 transition">S1</button>
                    <button onclick="setStage(2)" class="bg-gray-800 p-2 rounded text-xs hover:bg-blue-600 transition">S2</button>
                    <button onclick="setStage(3)" class="bg-gray-800 p-2 rounded text-xs hover:bg-blue-600 transition">S3</button>
                    <button onclick="setStage(4)" class="bg-blue-600 p-2 rounded text-xs font-bold">MAX</button>
                </div>
            </div>

            <!-- Carbon & Body -->
            <div class="glass p-4 rounded-2xl w-80">
                <p class="text-[10px] font-bold text-blue-500 mb-3 uppercase">Visual & Carbon Fiber</p>
                <div class="flex items-center justify-between">
                    <span class="text-xs">Full Body Carbon</span>
                    <input type="checkbox" onchange="toggleCarbon(this.checked)" class="w-5 h-5">
                </div>
                <div class="mt-3 flex gap-2">
                    <div class="w-6 h-6 rounded-full bg-black border border-white cursor-pointer" onclick="changeColor(0x000000)"></div>
                    <div class="w-6 h-6 rounded-full bg-red-600 cursor-pointer" onclick="changeColor(0xff0000)"></div>
                    <div class="w-6 h-6 rounded-full bg-gray-500 cursor-pointer" onclick="changeColor(0x888888)"></div>
                    <button class="text-[10px] bg-gray-800 px-2 rounded" onclick="changeColor(0x222222)">Matte</button>
                </div>
            </div>

            <!-- Rul & Salon -->
            <div class="glass p-4 rounded-2xl w-64 text-xs">
                <p class="text-[10px] font-bold text-blue-500 mb-3 uppercase">Interior & Wheels</p>
                <select onchange="changeWheels(this.value)" class="w-full bg-gray-900 p-2 rounded mb-2 outline-none">
                    <option value="stock">Stock Wheels</option>
                    <option value="amg">AMG Forged 22"</option>
                    <option value="carbon">Full Carbon Wheels</option>
                </select>
                <button onclick="toggleExhaust()" id="ex-btn" class="w-full bg-gray-800 p-2 rounded hover:bg-red-900 transition">Popcorn Exhaust: OFF</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, car;
        let isCarbon = false;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020202);
            scene.fog = new THREE.Fog(0x020202, 1, 15);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 1.5, 4);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.1; // Yerning tagiga tushib ketmaslik

            // Chiroqlar (Studiyadagidek)
            const mainLight = new THREE.DirectionalLight(0xffffff, 2);
            mainLight.position.set(5, 5, 5);
            scene.add(mainLight);

            const blueLight = new THREE.PointLight(0x007bff, 1);
            blueLight.position.set(-5, 2, -5);
            scene.add(blueLight);

            scene.add(new THREE.AmbientLight(0x404040, 1));

            // Zamin (Platforma)
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 100),
                new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.5 })
            );
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = -0.5;
            scene.add(mesh);

            // Mashina Modelini yaratish (Ramziy detallar bilan)
            const carGroup = new THREE.Group();
            
            // Kuzov
            const bodyGeo = new THREE.BoxGeometry(3, 0.6, 1.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 1, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            carGroup.add(body);

            // G'ildiraklar (4 ta)
            const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.2, 32);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const positions = [[1.2, -0.2, 0.8], [1.2, -0.2, -0.8], [-1.2, -0.2, 0.8], [-1.2, -0.2, -0.8]];
            
            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                carGroup.add(wheel);
            });

            car = carGroup;
            scene.add(car);

            animate();
        }

        // --- TUNING FUNKSIYALARI ---

        function setStage(level) {
            const hpText = document.getElementById('hp-text');
            const hpBar = document.getElementById('hp-bar');
            let hp = 585;
            let width = 60;

            if(level === 1) { hp = 650; width = 70; }
            if(level === 2) { hp = 720; width = 80; }
            if(level === 3) { hp = 850; width = 90; }
            if(level === 4) { hp = 1100; width = 100; }

            hpText.innerHTML = `${hp} <span class="text-sm">HP</span>`;
            hpBar.style.width = width + "%";
            
            // Effekt uchun rangni vaqtinchalik o'zgartirish
            hpText.style.color = "#3b82f6";
            setTimeout(() => hpText.style.color = "white", 500);
        }

        function changeColor(hex) {
            car.children[0].material.color.setHex(hex);
            car.children[0].material.map = null; // Karbonni o'chirish
        }

        function toggleCarbon(active) {
            const weightVal = document.getElementById('weight-val');
            if(active) {
                car.children[0].material.color.setHex(0x111111);
                car.children[0].material.roughness = 0.8;
                weightVal.innerText = "1350kg (-200kg)";
                weightVal.style.color = "#3b82f6";
            } else {
                car.children[0].material.roughness = 0.2;
                weightVal.innerText = "1550kg";
                weightVal.style.color = "white";
            }
        }

        function toggleExhaust() {
            const btn = document.getElementById('ex-btn');
            if(btn.innerText.includes("OFF")) {
                btn.innerText = "Popcorn Exhaust: ON";
                btn.className = "w-full bg-blue-600 p-2 rounded hover:bg-blue-700 transition";
            } else {
                btn.innerText = "Popcorn Exhaust: OFF";
                btn.className = "w-full bg-gray-800 p-2 rounded hover:bg-red-900 transition";
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
                        </html>
