<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercedes 3D Real-Time Tuning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Kutubxonasi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: white; overflow: hidden; font-family: sans-serif; }
        canvas { display: block; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .glass { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-dot:hover { transform: scale(1.2); border-color: white; }
    </style>
</head>
<body>

    <!-- 3D Sahnani joylashtirish uchun konteyner -->
    <div id="container" class="w-full h-screen"></div>

    <!-- UI Interfeys -->
    <div class="ui-overlay flex flex-col justify-between p-6">
        
        <!-- Yuqori qism -->
        <div class="flex justify-between items-center interactive">
            <div class="glass p-4 rounded-xl">
                <h1 class="text-xl font-bold tracking-tighter">MERCEDES-BENZ <span class="text-blue-500">3D</span></h1>
                <p class="text-[10px] text-gray-400">CONFIGURATOR V1.0</p>
            </div>
            <div class="glass px-6 py-3 rounded-full text-sm font-medium">S-CLASS (W223)</div>
        </div>

        <!-- Pastki qism: Tuning Paneli -->
        <div class="flex justify-center mb-10">
            <div class="glass p-6 rounded-3xl interactive flex flex-col items-center gap-4">
                <p class="text-xs uppercase tracking-widest text-gray-400">Kuzov rangini tanlang</p>
                <div class="flex gap-4">
                    <div class="color-dot bg-black" onclick="changeColor(0x000000)"></div>
                    <div class="color-dot bg-gray-400" onclick="changeColor(0x888888)"></div>
                    <div class="color-dot bg-blue-700" onclick="changeColor(0x0000ff)"></div>
                    <div class="color-dot bg-red-600" onclick="changeColor(0xff0000)"></div>
                    <div class="color-dot bg-white" onclick="changeColor(0xffffff)"></div>
                </div>
                <div class="mt-2 text-[10px] text-gray-500 italic">Sichqoncha bilan mashinani aylantirishingiz mumkin</div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, car;

        function init() {
            // 1. Sahna yaratish
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            // 2. Kamera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            camera.position.y = 1;

            // 3. Renderer (Tasvirni chiqarish)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // 4. Yorug'lik (Mashina ko'rinishi uchun)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);

            // 5. Avtomobil o'rniga hozircha "3D Shakl" (Kuzov ramzi)
            // Haqiqiy Mercedes .glb modelini yuklash uchun GLTFLoader ishlatiladi
            const geometry = new THREE.BoxGeometry(2.5, 1, 1.2); 
            const material = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8, roughness: 0.2 });
            car = new THREE.Mesh(geometry, material);
            scene.add(car);

            // Taglik (Platforma)
            const grid = new THREE.GridHelper(10, 20, 0x007bff, 0x222222);
            grid.position.y = -0.6;
            scene.add(grid);

            animate();
        }

        // Rangni o'zgartirish funksiyasi
        function changeColor(colorHex) {
            car.material.color.setHex(colorHex);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Mashinani sekin aylantirib turish
            car.rotation.y += 0.005;
            
            renderer.render(scene, camera);
        }

        // Oyna o'zgarganda moslashish
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
