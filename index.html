<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercedes-Benz 3D Tuning Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-border:hover {
            border-color: #007bff;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
            transition: 0.3s;
        }
        .car-display {
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* Avtomobil joylashgan joy effekti */
        .platform {
            width: 500px;
            height: 100px;
            background: rgba(0, 123, 255, 0.2);
            filter: blur(50px);
            border-radius: 50%;
            position: absolute;
            bottom: 20px;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header / Navigatsiya -->
    <header class="p-6 flex justify-between items-center glass">
        <div class="flex items-center gap-3">
            <i class="fab fa-vimeo-v text-3xl"></i> <!-- Mercedes logosi ramziy -->
            <h1 class="text-2xl font-bold tracking-widest uppercase">Mercedes-Benz <span class="text-blue-500">Tuning</span></h1>
        </div>
        <nav class="hidden md:flex gap-8 text-sm uppercase tracking-wider">
            <a href="#" class="hover:text-blue-500 transition">Modellar</a>
            <a href="#" class="hover:text-blue-500 transition">Galereya</a>
            <a href="#" class="hover:text-blue-500 transition">Saqlash</a>
        </nav>
        <button class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-full font-semibold transition">
            EXPORT 3D
        </button>
    </header>

    <main class="flex-1 flex flex-col md:flex-row">
        
        <!-- Chap tomondagi Model tanlash paneli -->
        <aside class="w-full md:w-72 p-6 glass flex flex-col gap-4 overflow-y-auto">
            <h2 class="text-gray-400 text-xs uppercase font-bold mb-2">Modelni tanlang</h2>
            <div class="space-y-3">
                <div class="p-3 glass rounded-lg cursor-pointer neon-border flex items-center gap-3">
                    <div class="w-12 h-8 bg-gray-800 rounded"></div>
                    <span>G-Class (G63)</span>
                </div>
                <div class="p-3 glass rounded-lg cursor-pointer neon-border flex items-center gap-3 border-blue-500">
                    <div class="w-12 h-8 bg-gray-800 rounded"></div>
                    <span class="text-blue-400">S-Class (W223)</span>
                </div>
                <div class="p-3 glass rounded-lg cursor-pointer neon-border flex items-center gap-3">
                    <div class="w-12 h-8 bg-gray-800 rounded"></div>
                    <span>GT 63 S</span>
                </div>
                <div class="p-3 glass rounded-lg cursor-pointer neon-border flex items-center gap-3">
                    <div class="w-12 h-8 bg-gray-800 rounded"></div>
                    <span>C-Class Coupe</span>
                </div>
            </div>
        </aside>

        <!-- Markaziy 3D Ko'rinish (Asosiy maydon) -->
        <section class="flex-1 car-display">
            <div class="platform"></div>
            <!-- Bu yerga Three.js kodi orqali 3D model yuklanadi -->
            <div class="text-center z-10">
                <p class="text-gray-500 italic mb-4">3D Model yuklanmoqda...</p>
                <h2 class="text-5xl font-black opacity-20 uppercase">S-CLASS 2024</h2>
                <i class="fas fa-car text-9xl mt-4 text-blue-500 opacity-80"></i>
            </div>
            
            <!-- Kamera boshqaruvi menyusi -->
            <div class="absolute bottom-10 flex gap-4">
                <button class="glass p-3 rounded-full hover:bg-white hover:text-black transition"><i class="fas fa-undo"></i></button>
                <button class="glass p-3 rounded-full hover:bg-white hover:text-black transition"><i class="fas fa-search-plus"></i></button>
                <button class="glass p-3 rounded-full hover:bg-white hover:text-black transition"><i class="fas fa-video"></i></button>
            </div>
        </section>

        <!-- O'ng tomondagi Tuning Sozlamalari -->
        <aside class="w-full md:w-80 p-6 glass overflow-y-auto">
            <h2 class="text-gray-400 text-xs uppercase font-bold mb-6 text-center">Tuning Paneli</h2>
            
            <!-- Rang tanlash -->
            <div class="mb-8">
                <label class="text-sm mb-3 block">Kuzov rangi</label>
                <div class="flex justify-between gap-2">
                    <div class="w-8 h-8 rounded-full bg-black border-2 border-white cursor-pointer"></div>
                    <div class="w-8 h-8 rounded-full bg-gray-500 cursor-pointer"></div>
                    <div class="w-8 h-8 rounded-full bg-blue-900 cursor-pointer"></div>
                    <div class="w-8 h-8 rounded-full bg-red-700 cursor-pointer"></div>
                    <div class="w-8 h-8 rounded-full bg-white cursor-pointer"></div>
                </div>
            </div>

            <!-- Diskalar tanlash -->
            <div class="mb-8">
                <label class="text-sm mb-3 block">Diska (Wheels)</label>
                <select class="w-full bg-transparent border border-gray-600 p-2 rounded text-sm outline-none">
                    <option class="bg-black">AMG Performance 21"</option>
                    <option class="bg-black">Maybach Exclusive 20"</option>
                    <option class="bg-black">Standard Multi-spoke</option>
                </select>
            </div>

            <!-- Oyna qoraytirish -->
            <div class="mb-8">
                <label class="text-sm mb-3 block">Oynalar (Tint)</label>
                <input type="range" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                <div class="flex justify-between text-[10px] mt-1 text-gray-500">
                    <span>0%</span>
                    <span>50%</span>
                    <span>100%</span>
                </div>
            </div>

            <!-- Qo'shimcha detallar -->
            <div class="space-y-4">
                <div class="flex justify-between items-center glass p-3 rounded">
                    <span class="text-sm">Carbon Fiber Kit</span>
                    <input type="checkbox" class="accent-blue-500">
                </div>
                <div class="flex justify-between items-center glass p-3 rounded">
                    <span class="text-sm">Sport Suspension</span>
                    <input type="checkbox" checked class="accent-blue-500">
                </div>
                <div class="flex justify-between items-center glass p-3 rounded">
                    <span class="text-sm">Night Package</span>
                    <input type="checkbox" class="accent-blue-500">
                </div>
            </div>
        </aside>
    </main>

    <!-- Pastki Panel -->
    <footer class="p-4 glass text-center text-[10px] text-gray-500 uppercase tracking-widest">
        © 2026 Mercedes-Benz Configurator | Created for Professional Tuning
    </footer>

</body>
</html>
